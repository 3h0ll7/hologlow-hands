name: Bug Report
description: Report a bug in HoloGlow Hands
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: "e.g. Chrome 120, Safari 17"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS & Device
      placeholder: "e.g. macOS 14, iPhone 15, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open the app
        2. Allow camera access
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: camera
    attributes:
      label: Camera Permission Status
      options:
        - Granted
        - Denied
        - Not prompted
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Any errors in the browser console?
      render: shell
