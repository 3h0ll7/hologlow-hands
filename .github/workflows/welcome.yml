name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const isPR = !!context.payload.pull_request;
            const author = isIssue
              ? context.payload.issue.user.login
              : context.payload.pull_request.user.login;

            let body;
            if (isIssue) {
              body = `Hey @${author}, thanks for opening this issue! 👋\n\nWe'll take a look as soon as possible. In the meantime, please make sure you've provided all the details requested in the issue template.\n\nCheck out our [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for guidelines.`;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.issue.number,
                body
              });
            } else if (isPR) {
              body = `Hey @${author}, thanks for this pull request! 🎉\n\nWe appreciate your contribution to HoloGlow Hands. Please make sure:\n- [ ] You've tested on Chrome with camera access\n- [ ] No console errors\n- [ ] Hand tracking still works smoothly\n\nCheck out our [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for guidelines.`;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
